<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Capacité</title>
</head>
<body>
<ul>
    <li th:each="c : ${Capacite}">
        <span th:text="${c.getId()}"></span>
        <span th:text="${c.getLibelle()}"></span>
    </li>
</ul>
</body>
</html>
